services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_app_dev
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ecommerce?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      - mongodb
    command: pnpm run dev
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: ecommerce_mongodb_dev
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis_dev
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  app_node_modules:
  mongo_data:
  redis_data:
