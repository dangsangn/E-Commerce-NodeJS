services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_app_dev
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      # MongoDB and Redis run in the cloud (Atlas / Redis Cloud) — the URLs come
      # from .env. The fallbacks below only apply with `--profile local-db`.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/ecommerce?replicaSet=rs0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Mail goes to the local Mailpit container, not Mailtrap/real SMTP.
      # Compose env wins over .env (dotenv never overrides an existing var).
      # Read every sent mail at http://localhost:8025
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_USER: mailpit
      SMTP_PASS: mailpit
      SMTP_FROM: 'Ecommerce <no-reply@ecommerce.local>'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      mailpit:
        condition: service_started
    command: pnpm run dev
    restart: unless-stopped

  # Opt-in local copy: docker compose --profile local-db up -d
  mongodb:
    image: mongo:7
    profiles: ['local-db']
    container_name: ecommerce_mongodb_dev
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: |
        mongosh --quiet --eval '
          const want = "mongodb:27017";
          try {
            // Already a healthy member? Make sure the host is correct.
            rs.status();
            const cfg = rs.conf();
            if (cfg.members[0].host !== want) {
              cfg.members[0].host = want;
              rs.reconfig(cfg, {force: true});
            }
          } catch (e) {
            try {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: want}]});
            } catch (e2) {
              // Already initialized but config is invalid (e.g. stale host) -> force fix.
              const cfg = rs.conf();
              cfg.members[0].host = want;
              rs.reconfig(cfg, {force: true});
            }
          }
          // Only report healthy once a PRIMARY exists.
          quit(rs.status().myState === 1 ? 0 : 1);
        '
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Opt-in local copy: docker compose --profile local-db up -d
  redis:
    image: redis:7-alpine
    profiles: ['local-db']
    container_name: ecommerce_redis_dev
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Local SMTP catcher: accepts any mail on :1025 and shows it in a web inbox
  # on :8025. Nothing is delivered to real addresses.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce_mailpit_dev
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      # The app always sends SMTP auth; accept any user/pass over plain SMTP.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    restart: unless-stopped

  mysql-master:
    image: mysql:8
    container_name: mysql_master
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - '8811:3306'
    volumes:
      - ./docker/mysql/master/my.cnf:/etc/mysql/conf.d/my.cnf

  mysql-slave:
    image: mysql:8
    container_name: mysql_slave
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - '8822:3306'
    volumes:
      - ./docker/mysql/slave/my.cnf:/etc/mysql/conf.d/my.cnf

volumes:
  app_node_modules:
  mongo_data:
  redis_data:
  master_data:
  slave_data:
