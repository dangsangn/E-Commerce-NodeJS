services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_app_dev
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ecommerce?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    command: pnpm run dev
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: ecommerce_mongodb_dev
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: |
        mongosh --quiet --eval '
          const want = "mongodb:27017";
          try {
            // Already a healthy member? Make sure the host is correct.
            rs.status();
            const cfg = rs.conf();
            if (cfg.members[0].host !== want) {
              cfg.members[0].host = want;
              rs.reconfig(cfg, {force: true});
            }
          } catch (e) {
            try {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: want}]});
            } catch (e2) {
              // Already initialized but config is invalid (e.g. stale host) -> force fix.
              const cfg = rs.conf();
              cfg.members[0].host = want;
              rs.reconfig(cfg, {force: true});
            }
          }
          // Only report healthy once a PRIMARY exists.
          quit(rs.status().myState === 1 ? 0 : 1);
        '
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis_dev
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mysql-master:
    image: mysql:8
    container_name: mysql_master
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '8811:3306'
    volumes:
      - ./docker/mysql/master/my.cnf:/etc/mysql/conf.d/my.cnf

  mysql-slave:
    image: mysql:8
    container_name: mysql_slave
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '8822:3306'
    volumes:
      - ./docker/mysql/slave/my.cnf:/etc/mysql/conf.d/my.cnf

volumes:
  app_node_modules:
  mongo_data:
  redis_data:
  master_data:
  slave_data:
