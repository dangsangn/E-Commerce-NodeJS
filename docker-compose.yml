services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_app_dev
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ecommerce
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      - mongodb
    command: npm run dev
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: ecommerce_mongodb_dev
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  app_node_modules:
  mongo_data:
